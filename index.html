<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
<title>GLOW by Ro — Revista Digital</title>
<meta name="description" content="Revista digital GLOW by Ro. Hojalá el catálogo y pedí por WhatsApp.">
<meta name="theme-color" content="#F58220">
<meta property="og:title" content="GLOW by Ro — Revista Digital">
<meta property="og:type" content="website">
<meta property="og:image" content="img/logo.png">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <button class="menu-btn" id="btnMenu" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <div class="brand">
      <img src="img/logo.png" alt="GLOW by Ro" class="brand-logo"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='grid'">
      <div class="brand-logo-fallback">✦</div>
      <div class="brand-text">
        <h1>GLOW by Ro</h1>
        <p class="sub" id="topSub">Revista digital</p>
      </div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="btnPages" title="Páginas" aria-label="Ver todas las páginas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="icon-btn" id="btnDownload" title="Descargar" aria-label="Descargar revista">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <a class="icon-btn whatsapp-btn" id="btnWhats" href="#" target="_blank" title="Escribinos por WhatsApp" aria-label="Escribinos por WhatsApp">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M17.5 14.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-1.8-.9-3-1.6-4.2-3.7-.3-.5.3-.5.9-1.5.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.3 5.1 4.6 1.9.8 2.7.9 3.6.7.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.2-.6-.4z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.1-1.3c1.4.8 3.1 1.3 4.9 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
    </a>
  </div>
</header>

<main class="viewer" id="viewer">
  <div class="flipbook" id="flipbook"></div>
  <div class="loader" id="loader">
    <div class="loader-spinner"></div>
    <p>Cargando revista…</p>
    <div class="loader-bar"><div class="loader-bar-fill" id="loaderBar"></div></div>
  </div>
</main>

<div class="page-indicator" id="pageIndicator" hidden>
  <button class="pi-btn" id="piPrev" aria-label="Página anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <span class="pi-label" id="piLabel">1 / 1</span>
  <button class="pi-btn" id="piNext" aria-label="Página siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>

<div class="modal pages-modal" id="pagesModal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2>Índice de páginas</h2>
      <button class="icon-btn-sm" id="closePages" aria-label="Cerrar">✕</button>
    </div>
    <div class="pages-grid" id="pagesGrid"></div>
  </div>
</div>

<a class="wa-float" id="waFloat" href="#" target="_blank" aria-label="Escribinos por WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26"><path d="M17.5 14.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-1.8-.9-3-1.6-4.2-3.7-.3-.5.3-.5.9-1.5.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.3 5.1 4.6 1.9.8 2.7.9 3.6.7.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.2-.6-.4z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.1-1.3c1.4.8 3.1 1.3 4.9 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
</a>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="script.js"></script>
</body>
</html>
